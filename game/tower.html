<title>M5Stack タワーバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: the same M5Stack cabinet as Stack Wars — the screen is a tall physics stage, A/B/C steer the held device. Single dark look by design. */
:root {
  color-scheme: dark;
  --bg: #14161c;
  --bg-2: #1c2029;
  --case: #26292f;
  --case-hi: #3a3e47;
  --glass: #0b0c0f;
  --sky-top: #1a2a44;
  --sky-bot: #223a5a;
  --fg: #eef1f6;
  --muted: #8c94a3;
  --accent: #ff8a3d;
  --p1: #ff8a3d;
  --p2: #4dc3ff;
  --btn: #c9ccd2;
  --btn-lo: #8e939b;
  --pwr: #e0473f;
  --display: "DotGothic16", "Hiragino Maru Gothic ProN", monospace;
  --body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 70%);
  color: var(--fg);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 16px 24px;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(20px, 5.4vw, 30px); letter-spacing: .04em; text-wrap: balance; text-align: center;
}
h1 small { display: block; font-size: .5em; color: var(--muted); letter-spacing: .3em; }
h1 b { color: var(--accent); font-weight: 400; }

.device {
  position: relative;
  width: min(440px, 100%);
  background: linear-gradient(160deg, var(--case-hi), var(--case) 35%, #17191d);
  border-radius: 34px;
  padding: 16px 16px 20px;
  box-sizing: border-box;
  box-shadow: 0 0 0 4px #fff, 0 0 0 6px #2b2b2b, 0 24px 50px rgba(0,0,0,.5);
}
.device::before {
  content: ""; position: absolute; left: -12px; top: 70px; width: 8px; height: 40px;
  border-radius: 4px 0 0 4px; background: var(--pwr);
}
.glass { background: var(--glass); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.screen { position: relative; border-radius: 6px; overflow: hidden; background: var(--sky-bot); }
canvas#game { width: 100%; display: block; touch-action: none; }
.hud {
  position: absolute; inset: 8px 8px auto 8px; display: flex; justify-content: space-between; align-items: flex-start;
  font-family: var(--display); pointer-events: none; gap: 8px;
}
.hud .box { background: rgba(10,14,22,.62); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.label { font-size: 10px; letter-spacing: .18em; color: var(--muted); }
.val { font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.val.turn-1 { color: var(--p1); } .val.turn-2 { color: var(--p2); }
.nextbox { display: flex; align-items: center; gap: 6px; }
.nextbox img { width: 34px; height: 34px; border-radius: 7px; background: #2a3448; padding: 2px; box-sizing: border-box; }

.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; background: rgba(14,18,26,.86); padding: 16px; font-family: var(--display);
}
.overlay[hidden] { display: none; }
.overlay h2 { margin: 0; font-weight: 400; font-size: 26px; }
.overlay p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; font-family: var(--body); max-width: 30ch; }
.overlay .big { font-size: 30px; color: var(--accent); font-variant-numeric: tabular-nums; }
.modes { display: flex; gap: 8px; }
.mode {
  font: inherit; font-size: 14px; color: var(--fg); background: transparent; border: 2px solid #4a5160; border-radius: 999px;
  padding: 6px 16px; cursor: pointer;
}
.mode[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.start {
  font: inherit; font-size: 18px; color: #1a1a1a; background: var(--accent); border: 0; border-radius: 999px;
  padding: 10px 28px; cursor: pointer; box-shadow: 0 4px 0 #b9581c;
}
.start:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9581c; }
.start:focus-visible, .key:focus-visible, .mode:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-inline: 10px; }
.key {
  height: 46px; border: 0; border-radius: 8px; cursor: pointer;
  background: linear-gradient(var(--btn), var(--btn-lo)); color: #222;
  font-family: var(--display); font-size: 15px; box-shadow: 0 4px 0 #555b63;
  display: flex; align-items: center; justify-content: center; gap: 6px; touch-action: none;
}
.key span { font-size: 11px; color: #4a4f57; }
.key:active, .key.on { transform: translateY(3px); box-shadow: 0 1px 0 #555b63; }
.keys.sub { grid-template-columns: 1fr 2fr; }
.keys.sub .key { height: 44px; background: linear-gradient(#5a5f69, #3f434b); color: var(--fg); box-shadow: 0 4px 0 #23262b; }
.keys.sub .key span { color: #b6bcc7; }
.keys.sub .key.drop { background: linear-gradient(#ff9d5c, #e2702a); color: #1a1a1a; box-shadow: 0 4px 0 #a34d16; font-size: 17px; }
.keys.sub .key.drop span { color: #5a2a0a; }

.help { width: min(440px, 100%); font-size: 12.5px; color: var(--muted); line-height: 1.7; display: grid; gap: 10px; }
.help kbd { font-family: var(--display); background: var(--bg-2); border: 1px solid #333a47; border-radius: 4px; padding: 0 5px; color: var(--fg); }
.roster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.roster figure { margin: 0; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; text-align: center; }
.roster img { width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 10px; padding: 4px; box-sizing: border-box; background: #2a3448; }
.roster .rare img { background: linear-gradient(135deg, #5a3a8a, #2a3448); box-shadow: 0 0 0 2px #b48cff inset; }
.roster b { color: var(--fg); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .key, .start { transition: none; } }
</style>

<h1><small>M5STACK</small>タワー<b>バトル</b></h1>

<div class="device">
  <div class="glass">
    <div class="screen">
      <canvas id="game" aria-label="タワーのステージ"></canvas>
      <div class="hud">
        <div class="box"><div class="label" id="scoreLabel">つんだ数</div><div class="val" id="score">0</div></div>
        <div class="box"><div class="label">高さ</div><div class="val" id="height">0mm</div></div>
        <div class="box nextbox"><div><div class="label">NEXT</div><div class="val" id="nextName" style="font-size:12px">-</div></div><img id="nextImg" alt=""></div>
      </div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">タワーバトル</h2>
        <div class="big" id="ovScore" hidden>0</div>
        <p id="ovText">M5Stackのデバイスを台の上に積み上げよう。<br>落としたら負け。</p>
        <div class="modes">
          <button class="mode" id="mode1" aria-pressed="true">ひとりで</button>
          <button class="mode" id="mode2" aria-pressed="false">2人で対戦</button>
        </div>
        <button class="start" id="startBtn">スタート</button>
      </div>
    </div>
    <div class="keys">
      <button class="key" id="kA" aria-label="左へ移動">◀<span>A</span></button>
      <button class="key" id="kB" aria-label="回転">⟳<span>B</span></button>
      <button class="key" id="kC" aria-label="右へ移動">▶<span>C</span></button>
    </div>
    <div class="keys sub">
      <button class="key" id="kL" aria-label="左回転">⟲<span>Z</span></button>
      <button class="key drop" id="kDrop" aria-label="落とす">▼ 落とす<span>Space</span></button>
    </div>
  </div>
</div>

<section class="help">
  <div class="roster" id="roster"></div>
  <div>
    操作: <kbd>←</kbd><kbd>→</kbd> 移動 / <kbd>↑</kbd><kbd>X</kbd> 右に15°回転 / <kbd>Z</kbd> 左に15°回転 / <kbd>Space</kbd><kbd>↓</kbd> 落とす。
    スマホは画面を左右にドラッグで移動、タップで回転、「落とす」ボタンで落下。
  </div>
  <div>デバイスは実物の大きさの比率。小さい AtomS3 や細長い Stick は積みにくいぶん 2点、レアな <b>Module LLM</b> は 3点。台から落ちたら終了（2人対戦では落とした人の負け）。</div>
</section>

  { key: 'stick',   name: 'StickC',     pts: 2, mm: 24, main: [145, 45, 222, 422], parts: [[341, 139, 44, 92], [127, 289, 44, 68]] },
  { key: 'sticks3', name: 'StickS3',    pts: 2, mm: 24, main: [145, 45, 222, 422], parts: [[341, 109, 44, 92], [127, 319, 44, 72]] },
  { key: 'mp135',   name: 'CoreMP135',  pts: 1, mm: 54, main: [85, 85, 342, 342], parts: [[185, 45, 142, 82], [185, 385, 142, 82]] },
  { key: 'llm',     name: 'Module LLM', pts: 3, mm: 54, main: [85, 85, 342, 342], parts: [], rare: true },
];
for (const d of DEVICES) {
  const rs = [d.main, ...d.parts];
  const x0 = Math.min(...rs.map(r => r[0])), y0 = Math.min(...rs.map(r => r[1]));
  const x1 = Math.max(...rs.map(r => r[0] + r[2])), y1 = Math.max(...rs.map(r => r[1] + r[3]));
  d.crop = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  d.k = d.mm / d.main[2] * PX_MM;
  d.img = new Image(); d.img.src = ICONS[d.key];
}
const PLATFORM_W = 200, PLATFORM_H = 26;

const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d');
$('roster').innerHTML = DEVICES.map(d =>
  `<figure${d.rare ? ' class="rare"' : ''}><img src="${ICONS[d.key]}" alt="${d.name}"><figcaption>${d.name} <b>${d.pts}点</b>${d.rare ? ' レア' : ''}</figcaption></figure>`).join('');

let hi = 0;
try { hi = +localStorage.getItem('m5tower-hi') || 0; } catch (e) {}

// ---------- physics ----------
const engine = Engine.create({ enableSleeping: true, positionIterations: 10, velocityIterations: 8 });
engine.gravity.y = 1;
const world = engine.world;
const platform = Bodies.rectangle(0, PLATFORM_H / 2, PLATFORM_W, PLATFORM_H, { isStatic: true, friction: 1, label: 'platform' });
Composite.add(world, platform);

function makePiece(dev) {
  const c = dev.crop, cx = c.x + c.w / 2, cy = c.y + c.h / 2, k = dev.k;
  const opt = { friction: .9, frictionStatic: 1.2, restitution: .02, density: .002 };
  const parts = [dev.main, ...dev.parts].map(r =>
    Bodies.rectangle((r[0] + r[2] / 2 - cx) * k, (r[1] + r[3] / 2 - cy) * k, r[2] * k, r[3] * k, opt));
  const body = Body.create({ parts, ...opt, label: dev.key });
  body.plugin = { dev, off: { x: -body.position.x, y: -body.position.y } }; // crop centre relative to centre of mass
  return body;
}
const pieceCentre = b => Vector.add(b.position, Vector.rotate(b.plugin.off, b.angle));

// ---------- game state ----------
let mode = 1, S;
function fresh() {
  Composite.remove(world, Composite.allBodies(world).filter(b => b !== platform));
  return {
    phase: 'title', // title | aim | fall | over
    held: null, next: null, count: 0, dropped: 0, score: 0, turn: 1,
    stableT: 0, fallT: 0, camY: 0, popups: [], banner: null, shake: 0,
  };
}
function pick() {
  if (S.dropped >= 2 && Math.random() < .1) return DEVICES.find(d => d.rare);
  const pool = DEVICES.filter(d => !d.rare);
  return pool[Math.floor(Math.random() * pool.length)];
}
function towerTop() {
  let top = 0;
  for (const b of Composite.allBodies(world)) if (b !== platform && !b.plugin.fell) top = Math.min(top, b.bounds.min.y);
  return top;
}
function spawn() {
  const dev = S.next || pick();
  S.next = pick();
  const b = makePiece(dev);
  Body.setAngle(b, [0, Math.PI / 2, Math.PI, -Math.PI / 2][Math.floor(Math.random() * 4)]);
  Body.setPosition(b, { x: 0, y: towerTop() - 150 });
  S.held = b; S.phase = 'aim';
  if (dev.rare) { S.banner = { text: 'Module LLM 登場！', t: 1.6, color: '#c9a6ff' }; beep(5); }
  $('nextName').textContent = S.next.name; $('nextImg').src = ICONS[S.next.key];
}
function moveHeld(dx) {
  if (S.phase !== 'aim') return;
  const lim = canvas.clientWidth / 2 - 30;
  Body.setPosition(S.held, { x: Math.max(-lim, Math.min(lim, S.held.position.x + dx)), y: S.held.position.y });
}
function rotateHeld(dir) {
  if (S.phase !== 'aim') return;
  Body.setAngle(S.held, S.held.angle + dir * Math.PI / 12);
}
function drop() {
  if (S.phase !== 'aim') return;
  const b = S.held; S.held = null;
  Body.setVelocity(b, { x: 0, y: 0 }); Body.setAngularVelocity(b, 0);
  Composite.add(world, b);
  S.phase = 'fall'; S.stableT = 0; S.fallT = 0; S.dropped++;
  beep(1);
}
function settled() {
  const b = Composite.allBodies(world).filter(x => x !== platform && !x.plugin.fell).pop();
  if (b) {
    const pts = b.plugin.dev.pts;
    S.count++; S.score += pts;
    const c = pieceCentre(b);
    S.popups.push({ x: c.x, y: c.y - 20, text: '+' + pts, t: 1 });
    if (pts > 1) beep(2 + pts);
  }
  if (mode === 2) S.turn = S.turn === 1 ? 2 : 1;
  spawn();
}
function gameOver(fellBody) {
  S.phase = 'over'; S.shake = .6; beep(0);
  if (mode === 1) {
    if (S.score > hi) { hi = S.score; try { localStorage.setItem('m5tower-hi', hi); } catch (e) {} }
    showOverlay('ゲームオーバー', `${S.count}個つんだ・高さ ${heightMM()}mm<br>ハイスコア ${hi}`, 'もう一度', S.score);
  } else {
    const loser = S.turn, winner = loser === 1 ? 2 : 1;
    showOverlay(`${winner}P の勝ち！`, `${loser}P が ${fellBody.plugin.dev.name} を落としました<br>${S.count}個つみました`, 'もう一度');
  }
}
function heightMM() { return Math.max(0, Math.round(-towerTop() / PX_MM)); }
function showOverlay(title, text, btn, score) {
  $('ovTitle').textContent = title;
  $('ovText').innerHTML = text;
  $('startBtn').textContent = btn;
  $('ovScore').hidden = score == null;
  if (score != null) $('ovScore').textContent = score;
  $('overlay').hidden = false;
}
function start() {
  S = fresh(); $('overlay').hidden = true;
  $('scoreLabel').textContent = mode === 1 ? 'スコア' : 'ターン';
  spawn();
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
function update(dt) {
  if (!S) return;
  S.popups = S.popups.filter(p => (p.t -= dt) > 0);
  if (S.banner && (S.banner.t -= dt) <= 0) S.banner = null;
  if (S.shake > 0) S.shake -= dt;
  if (S.phase === 'aim') {
    if (held.left) moveHeld(-240 * dt);
    if (held.right) moveHeld(240 * dt);
  }
  if (S.phase === 'aim' || S.phase === 'fall' || S.phase === 'over') {
    acc += dt;
    let steps = 0;
    while (acc >= 1 / 60 && steps++ < 4) { Engine.update(engine, 1000 / 60); acc -= 1 / 60; }
  }
  // anything below the platform has fallen
  const bodies = Composite.allBodies(world);
  for (const b of bodies) {
    if (b === platform || b.plugin.fell) continue;
    if (b.position.y > 420) {
      b.plugin.fell = true;
      if (S.phase !== 'over' && S.phase !== 'title') gameOver(b);
    }
  }
  if (S.phase === 'fall') {
    S.fallT += dt;
    const moving = bodies.some(b => b !== platform && !b.plugin.fell && !b.isSleeping && (b.speed > .25 || b.angularSpeed > .03));
    S.stableT = moving ? 0 : S.stableT + dt;
    if (S.stableT > .45 || S.fallT > 6) settled();
  }
  // camera follows the tower top
  const H = canvas.clientHeight;
  const top = Math.min(towerTop(), S.held ? S.held.position.y + 40 : 0);
  const target = Math.min(-(H - 90), top - H * .42);
  S.camY += (target - S.camY) * Math.min(1, dt * 5);
  $('score').textContent = mode === 1 ? S.score : S.turn + 'P';
  $('score').className = 'val' + (mode === 2 ? ' turn-' + S.turn : '');
  $('height').textContent = heightMM() + 'mm';
}

// ---------- drawing ----------
let dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = Math.round(w * 1.45);
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
}
function draw() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a2a44'); g.addColorStop(1, '#2a4a70');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!S) return;
  const camY = S.camY, sx = W / 2 + (S.shake > 0 ? (Math.random() - .5) * 8 * S.shake : 0);
  const toX = x => sx + x, toY = y => y - camY;
  // height ruler every 100 mm
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.font = '10px DotGothic16, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let mm = 100; mm < 4000; mm += 100) {
    const y = toY(-mm * PX_MM); if (y < -10) break; if (y > H) continue;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillText(mm + 'mm', 4, y - 7);
  }
  // platform + pedestal
  const py = toY(0);
  ctx.fillStyle = '#2b3140'; ctx.fillRect(toX(-PLATFORM_W / 2) + 10, py + PLATFORM_H, PLATFORM_W - 20, H);
  ctx.fillStyle = '#3d4455'; ctx.fillRect(toX(-PLATFORM_W / 2), py, PLATFORM_W, PLATFORM_H);
  ctx.fillStyle = '#5a6275'; ctx.fillRect(toX(-PLATFORM_W / 2), py, PLATFORM_W, 4);
  ctx.fillStyle = '#9aa3b5'; ctx.font = '11px DotGothic16, monospace'; ctx.textAlign = 'center';
  ctx.fillText('M5STACK', toX(0), py + PLATFORM_H / 2 + 1);
  // pieces
  for (const b of Composite.allBodies(world)) if (b !== platform) drawPiece(b, toX, toY, b.plugin.fell ? .35 : 1);
  if (S.held) {
    // drop guide
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(toX(S.held.position.x), toY(S.held.position.y)); ctx.lineTo(toX(S.held.position.x), py); ctx.stroke();
    ctx.setLineDash([]);
    drawPiece(S.held, toX, toY, 1);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of S.popups) {
    ctx.globalAlpha = Math.min(1, p.t * 2);
    ctx.font = '20px DotGothic16, monospace'; ctx.lineWidth = 4; ctx.strokeStyle = '#111'; ctx.fillStyle = '#fff';
    const y = toY(p.y) - (1 - p.t) * 30;
    ctx.strokeText(p.text, toX(p.x), y); ctx.fillText(p.text, toX(p.x), y);
  }
  if (S.banner) {
    ctx.globalAlpha = Math.min(1, S.banner.t * 3);
    ctx.font = '26px DotGothic16, monospace'; ctx.lineWidth = 6; ctx.strokeStyle = '#111'; ctx.fillStyle = S.banner.color || '#ff8a3d';
    ctx.strokeText(S.banner.text, W / 2, H * .3); ctx.fillText(S.banner.text, W / 2, H * .3);
  }
  ctx.globalAlpha = 1;
}
function drawPiece(b, toX, toY, alpha) {
  const d = b.plugin.dev, c = pieceCentre(b), k = d.k;
  if (!d.img.complete) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(toX(c.x), toY(c.y)); ctx.rotate(b.angle);
  ctx.drawImage(d.img, d.crop.x, d.crop.y, d.crop.w, d.crop.h, -d.crop.w * k / 2, -d.crop.h * k / 2, d.crop.w * k, d.crop.h * k);
  ctx.restore();
}

// ---------- input ----------
const held = { left: false, right: false };
function press(k) {
  if (!S || S.phase === 'title' || S.phase === 'over') return;
  if (k === 'left') { moveHeld(-12); held.left = true; }
  if (k === 'right') { moveHeld(12); held.right = true; }
  if (k === 'cw') rotateHeld(1);
  if (k === 'ccw') rotateHeld(-1);
  if (k === 'drop') drop();
}
function release(k) { if (k in held) held[k] = false; }
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'cw', x: 'cw', X: 'cw', z: 'ccw', Z: 'ccw', ArrowDown: 'drop', ' ': 'drop' };
addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && !$('overlay').hidden) { e.preventDefault(); $('startBtn').click(); return; }
  const k = KEYMAP[e.key]; if (!k) return;
  e.preventDefault(); if (!e.repeat) press(k);
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) release(k); });
const BTN = { kA: 'left', kB: 'cw', kC: 'right', kL: 'ccw', kDrop: 'drop' };
for (const [id, k] of Object.entries(BTN)) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); el.classList.add('on'); press(k); });
  const up = () => { el.classList.remove('on'); release(k); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('click', e => { if (e.detail === 0) press(k); });
}
let tp = null;
canvas.addEventListener('pointerdown', e => { tp = { x: e.clientX, y: e.clientY, moved: false }; canvas.setPointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!tp || !S || S.phase !== 'aim') return;
  const dx = e.clientX - tp.x;
  if (Math.abs(dx) > 2) { moveHeld(dx); tp.x = e.clientX; tp.moved = true; }
});
canvas.addEventListener('pointerup', e => {
  if (tp && !tp.moved && Math.abs(e.clientY - tp.y) < 10) press('cw');
  tp = null;
});
$('mode1').addEventListener('click', () => setMode(1));
$('mode2').addEventListener('click', () => setMode(2));
function setMode(m) {
  mode = m;
  $('mode1').setAttribute('aria-pressed', m === 1);
  $('mode2').setAttribute('aria-pressed', m === 2);
}
$('startBtn').addEventListener('click', start);

let ac = null;
function beep(n) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = n === 0 ? 'sawtooth' : 'square';
    o.frequency.value = n === 0 ? 110 : 330 * Math.pow(2, n / 6);
    g.gain.setValueAtTime(.05, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + (n === 0 ? .5 : .18));
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .5);
  } catch (e) {}
}

function boot() {
  S = fresh();
  // demo stack on the title screen so the first frame shows the game
  const demo = [['basic', 0, 0], ['core2', -4, 0], ['fire', 6, 0], ['atoms3', -10, 0]];
  for (const [key, x, a] of demo) {
    const b = makePiece(DEVICES.find(d => d.key === key));
    Body.setAngle(b, a); Body.setPosition(b, { x, y: towerTop() - 70 });
    Composite.add(world, b);
  }
  for (let i = 0; i < 240; i++) Engine.update(engine, 1000 / 60);
  S.camY = -(canvas.clientHeight - 90);
  resize(); requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); boot();
</script>
