<title>M5Stack スタックウォーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one big M5Stack Core as the cabinet — the screen is the board, A/B/C are the controls. Single dark look by design. */
:root {
  color-scheme: dark;
  --bg: #14161c;
  --bg-2: #1c2029;
  --case: #26292f;
  --case-hi: #3a3e47;
  --glass: #0b0c0f;
  --screen: #1a2230;
  --screen-grid: #222c3d;
  --fg: #eef1f6;
  --muted: #8c94a3;
  --accent: #ff8a3d;
  --btn: #c9ccd2;
  --btn-lo: #8e939b;
  --pwr: #e0473f;
  --display: "DotGothic16", "Hiragino Maru Gothic ProN", monospace;
  --body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 70%);
  color: var(--fg);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 16px 24px;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(20px, 5.4vw, 30px); letter-spacing: .04em; text-wrap: balance; text-align: center;
}
h1 small { display: block; font-size: .5em; color: var(--muted); letter-spacing: .3em; }
h1 b { color: var(--accent); font-weight: 400; }

.device {
  position: relative;
  width: min(440px, 100%);
  background: linear-gradient(160deg, var(--case-hi), var(--case) 35%, #17191d);
  border-radius: 34px;
  padding: 16px 16px 20px;
  box-sizing: border-box;
  box-shadow: 0 0 0 4px #fff, 0 0 0 6px #2b2b2b, 0 24px 50px rgba(0,0,0,.5);
}
.device::before { /* power button on the left side, like the real Basic */
  content: ""; position: absolute; left: -12px; top: 70px; width: 8px; height: 40px;
  border-radius: 4px 0 0 4px; background: var(--pwr);
}
.glass { background: var(--glass); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.screen {
  position: relative; display: grid; grid-template-columns: 1fr 88px; gap: 10px;
  background: var(--screen); border-radius: 6px; padding: 8px;
}
canvas#board { width: 100%; display: block; border-radius: 4px; background: var(--screen-grid); touch-action: none; }
.side { display: flex; flex-direction: column; gap: 10px; font-family: var(--display); min-width: 0; }
.label { font-size: 11px; letter-spacing: .18em; color: var(--muted); }
.val { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; word-break: break-all; }
canvas#next { width: 100%; display: block; background: var(--screen-grid); border-radius: 4px; }
.chainbox .val { color: var(--accent); }

.overlay {
  position: absolute; inset: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; background: rgba(14,18,26,.86); border-radius: 4px; padding: 12px;
  font-family: var(--display);
}
.overlay[hidden] { display: none; }
.overlay h2 { margin: 0; font-weight: 400; font-size: 26px; }
.overlay p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; font-family: var(--body); }
.overlay .big { font-size: 30px; color: var(--accent); font-variant-numeric: tabular-nums; }
.start {
  font: inherit; font-size: 18px; color: #1a1a1a; background: var(--accent); border: 0; border-radius: 999px;
  padding: 10px 28px; cursor: pointer; box-shadow: 0 4px 0 #b9581c;
}
.start:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9581c; }
.start:focus-visible, .key:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-inline: 10px; }
.key {
  height: 46px; border: 0; border-radius: 8px; cursor: pointer;
  background: linear-gradient(var(--btn), var(--btn-lo)); color: #222;
  font-family: var(--display); font-size: 15px; box-shadow: 0 4px 0 #555b63;
  display: flex; align-items: center; justify-content: center; gap: 6px; touch-action: none;
}
.key span { font-size: 11px; color: #4a4f57; }
.key:active, .key.on { transform: translateY(3px); box-shadow: 0 1px 0 #555b63; }
.keys.sub .key { height: 38px; background: linear-gradient(#5a5f69, #3f434b); color: var(--fg); box-shadow: 0 4px 0 #23262b; }
.keys.sub .key span { color: #b6bcc7; }

.help { width: min(440px, 100%); font-size: 12.5px; color: var(--muted); line-height: 1.7; display: grid; gap: 10px; }
.help kbd { font-family: var(--display); background: var(--bg-2); border: 1px solid #333a47; border-radius: 4px; padding: 0 5px; color: var(--fg); }
.roster { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.roster figure { margin: 0; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; text-align: center; }
.roster img { width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 10px; padding: 4px; box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { .key, .start { transition: none; } }
</style>

<h1><small>M5STACK</small>スタック<b>ウォーズ</b></h1>

<div class="device">
  <div class="glass">
    <div class="screen">
      <canvas id="board" aria-label="ゲーム盤"></canvas>
      <div class="side">
        <div><div class="label">NEXT</div><canvas id="next"></canvas></div>
        <div><div class="label">SCORE</div><div class="val" id="score">0</div></div>
        <div><div class="label">HI</div><div class="val" id="hi">0</div></div>
        <div><div class="label">LEVEL</div><div class="val" id="level">1</div></div>
        <div class="chainbox"><div class="label">MAX連鎖</div><div class="val" id="maxchain">0</div></div>
      </div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">スタックウォーズ</h2>
        <div class="big" id="ovScore" hidden>0</div>
        <p id="ovText">同じデバイスを縦横に<br>4つつなげると消えて得点。<br>連鎖で大量得点をねらおう。</p>
        <button class="start" id="startBtn">スタート</button>
      </div>
    </div>
    <div class="keys">
      <button class="key" id="kA" aria-label="左へ移動">◀<span>A</span></button>
      <button class="key" id="kB" aria-label="回転">⟳<span>B</span></button>
      <button class="key" id="kC" aria-label="右へ移動">▶<span>C</span></button>
    </div>
    <div class="keys sub">
      <button class="key" id="kL" aria-label="左回転">⟲<span>回転</span></button>
      <button class="key" id="kD" aria-label="早く落とす">▼<span>ソフト</span></button>
      <button class="key" id="kH" aria-label="一気に落とす">⤓<span>ハード</span></button>
    </div>
  </div>
</div>

<section class="help">
  <div class="roster" id="roster"></div>
  <div>
    操作: <kbd>←</kbd><kbd>→</kbd> 移動 / <kbd>↑</kbd><kbd>X</kbd> 右回転 / <kbd>Z</kbd> 左回転 / <kbd>↓</kbd> ソフトドロップ / <kbd>Space</kbd> ハードドロップ / <kbd>P</kbd> 一時停止。
    スマホは盤面をタップで回転、左右スワイプで移動、下にはらうと一気に落ちます。
  </div>
  <div>得点 = 消した数 × 10 × (連鎖ボーナス + 連結ボーナス + 色数ボーナス)。盤面を全部消すと「全消し」で +2100。</div>
</section>

const GROUP_BONUS = n => n <= 4 ? 0 : n >= 11 ? 10 : n - 3;
const COLOR_BONUS = [0, 0, 3, 6, 12, 24];
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // child offset by rotation

const $ = id => document.getElementById(id);
const board = $('board'), bctx = board.getContext('2d');
const nextC = $('next'), nctx = nextC.getContext('2d');
const imgs = TYPES.map(t => { const i = new Image(); i.src = ICONS[t.key]; return i; });

// roster under the device
$('roster').innerHTML = TYPES.map(t =>
  `<figure><img src="${ICONS[t.key]}" alt="${t.name}" style="background:${t.tile}"><figcaption>${t.name}</figcaption></figure>`).join('');

let hi = 0;
try { hi = +localStorage.getItem('m5sw-hi') || 0; } catch (e) {}
$('hi').textContent = hi;

let S; // game state
function fresh() {
  return {
    grid: Array.from({ length: H }, () => Array(W).fill(null)),
    cur: null, queue: [rndPair(), rndPair()],
    score: 0, level: 1, maxChain: 0, chain: 0,
    phase: 'title', // title | play | fall | pop | over | pause
    fallT: 0, lockT: 0, popT: 0, popping: [], popups: [], banner: null,
  };
}
function rndPair() { return [rnd(), rnd()]; }
function rnd() { return Math.floor(Math.random() * TYPES.length); }
const cell = t => ({ t, dy: 0 }); // dy: visual offset in rows (falling animation)

function spawn() {
  const [a, b] = S.queue.shift();
  S.queue.push(rndPair());
  S.cur = { x: 2, y: 1, r: 0, a, b, dy: 0 };
  S.lockT = 0; S.fallT = 0;
  if (S.grid[1][2]) return gameOver();
  S.phase = 'play';
}
const occupied = (x, y) => x < 0 || x >= W || y >= H || (y >= 0 && S.grid[y][x]);
function fits(x, y, r) {
  const [dx, dy] = DIRS[r];
  return !occupied(x, y) && !occupied(x + dx, y + dy);
}
function move(d) {
  if (S.phase !== 'play') return;
  if (fits(S.cur.x + d, S.cur.y, S.cur.r)) { S.cur.x += d; S.lockT = 0; }
}
function rotate(dir) {
  if (S.phase !== 'play') return;
  const c = S.cur, r = (c.r + dir + 4) % 4;
  const [dx, dy] = DIRS[r];
  const tries = [[0, 0], [-dx, -dy], [0, -1]];
  for (const [ox, oy] of tries) {
    if (fits(c.x + ox, c.y + oy, r)) { c.x += ox; c.y += oy; c.r = r; S.lockT = 0; return; }
  }
  // squeezed between walls: flip 180°
  const r2 = (c.r + 2) % 4;
  if (fits(c.x, c.y, r2)) { c.r = r2; return; }
  if (fits(c.x, c.y - 1, r2)) { c.y -= 1; c.r = r2; }
}
function step() { // one row down; returns false when blocked
  if (fits(S.cur.x, S.cur.y + 1, S.cur.r)) { S.cur.y++; return true; }
  return false;
}
function softDrop() { if (S.phase === 'play' && step()) { S.score += 1; S.fallT = 0; } }
function hardDrop() {
  if (S.phase !== 'play') return;
  let n = 0; while (step()) n++;
  S.score += n * 2; lock();
}
function lock() {
  const c = S.cur, [dx, dy] = DIRS[c.r];
  place(c.x, c.y, c.a); place(c.x + dx, c.y + dy, c.b);
  S.cur = null; S.chain = 0;
  settle();
}
function place(x, y, t) { if (y >= 0) S.grid[y][x] = cell(t); }

function settle() { // apply gravity with animation
  let moving = false;
  for (let x = 0; x < W; x++) {
    let w = H - 1;
    for (let y = H - 1; y >= 0; y--) {
      const c = S.grid[y][x];
      if (!c) continue;
      if (w !== y) { S.grid[w][x] = c; S.grid[y][x] = null; c.dy += w - y; moving = true; }
      w--;
    }
  }
  S.phase = moving ? 'fall' : 'check';
  if (!moving) check();
}
function check() {
  const seen = Array.from({ length: H }, () => Array(W).fill(false));
  const groups = [];
  for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) {
    const c = S.grid[y][x];
    if (!c || seen[y][x]) continue;
    const g = [], st = [[x, y]]; seen[y][x] = true;
    while (st.length) {
      const [cx, cy] = st.pop(); g.push([cx, cy]);
      for (const [dx, dy] of DIRS) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || nx >= W || ny < 1 || ny >= H || seen[ny][nx]) continue;
        const n = S.grid[ny][nx];
        if (n && n.t === c.t) { seen[ny][nx] = true; st.push([nx, ny]); }
      }
    }
    if (g.length >= 4) groups.push({ t: c.t, cells: g });
  }
  if (!groups.length) {
    if (S.chain > 0 && S.grid.every(r => r.every(c => !c))) {
      S.score += 2100; S.banner = { text: '全消し！ +2100', t: 1.6 };
    }
    return spawn();
  }
  S.chain++;
  S.maxChain = Math.max(S.maxChain, S.chain);
  const count = groups.reduce((s, g) => s + g.cells.length, 0);
  const colors = new Set(groups.map(g => g.t)).size;
  const bonus = (CHAIN_POWER[Math.min(S.chain - 1, CHAIN_POWER.length - 1)]
    + groups.reduce((s, g) => s + GROUP_BONUS(g.cells.length), 0) + COLOR_BONUS[colors]) || 1;
  const pts = count * 10 * bonus;
  S.score += pts;
  S.popping = groups.flatMap(g => g.cells);
  const [px, py] = S.popping[0];
  S.popups.push({ x: px + .5, y: py, text: '+' + pts, t: 1.1 });
  if (S.chain >= 2) S.banner = { text: S.chain + '連鎖！', t: 1.1 };
  S.popT = 0; S.phase = 'pop';
  beep(S.chain);
}

function gameOver() {
  S.phase = 'over';
  if (S.score > hi) { hi = S.score; try { localStorage.setItem('m5sw-hi', hi); } catch (e) {} }
  showOverlay('ゲームオーバー', `最大 ${S.maxChain} 連鎖`, 'もう一度', S.score);
}
function showOverlay(title, text, btn, score) {
  $('ovTitle').textContent = title;
  $('ovText').innerHTML = text;
  $('startBtn').textContent = btn;
  $('ovScore').hidden = score == null;
  if (score != null) $('ovScore').textContent = score.toLocaleString();
  $('overlay').hidden = false;
}
function start() {
  S = fresh(); $('overlay').hidden = true; spawn(); board.focus?.();
}
function togglePause() {
  if (S.phase === 'pause') { S.phase = S.resume; $('overlay').hidden = true; }
  else if (['play', 'fall', 'pop'].includes(S.phase)) {
    S.resume = S.phase; S.phase = 'pause';
    showOverlay('一時停止', 'P キーかボタンで再開', '再開');
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
function update(dt) {
  if (!S) return;
  S.popups = S.popups.filter(p => (p.t -= dt) > 0);
  if (S.banner && (S.banner.t -= dt) <= 0) S.banner = null;
  if (S.phase === 'play') {
    if (held.down) { held.downT -= dt; if (held.downT <= 0) { softDrop(); held.downT = .04; } }
    for (const k of ['left', 'right']) if (held[k]) {
      held[k + 'T'] -= dt; if (held[k + 'T'] <= 0) { move(k === 'left' ? -1 : 1); held[k + 'T'] = .07; }
    }
    if (S.phase !== 'play') return;
    const interval = Math.max(.12, .8 - (S.level - 1) * .07);
    if (fits(S.cur.x, S.cur.y + 1, S.cur.r)) {
      S.lockT = 0; S.fallT += dt;
      if (S.fallT >= interval) { S.fallT = 0; step(); }
    } else {
      S.lockT += dt;
      if (S.lockT > .45) lock();
    }
  } else if (S.phase === 'fall') {
    let moving = false;
    for (const row of S.grid) for (const c of row) if (c && c.dy > 0) {
      c.dy = Math.max(0, c.dy - dt * 16); if (c.dy > 0) moving = true;
    }
    if (!moving) { S.phase = 'check'; check(); }
  } else if (S.phase === 'pop') {
    S.popT += dt;
    if (S.popT > .45) {
      for (const [x, y] of S.popping) S.grid[y][x] = null;
      S.popping = []; settle();
    }
  }
  S.level = 1 + Math.floor(S.score / 2500);
  $('score').textContent = S.score.toLocaleString();
  $('level').textContent = S.level;
  $('maxchain').textContent = S.maxChain;
  $('hi').textContent = Math.max(hi, S.score).toLocaleString();
}

// ---------- drawing ----------
let CS = 32, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = board.clientWidth; CS = w / W;
  board.style.height = (CS * (H - 1)) + 'px';
  board.width = Math.round(w * dpr); board.height = Math.round(CS * (H - 1) * dpr);
  const nw = nextC.clientWidth;
  nextC.style.height = (nw * 1.25) + 'px';
  nextC.width = Math.round(nw * dpr); nextC.height = Math.round(nw * 1.25 * dpr);
}
function drawPiece(ctx, t, px, py, size, scale = 1, alpha = 1) {
  const s = size * scale, ox = px + (size - s) / 2, oy = py + (size - s) / 2, pad = s * .05;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = TYPES[t].tile;
  roundRect(ctx, ox + pad, oy + pad, s - pad * 2, s - pad * 2, s * .22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  roundRect(ctx, ox + pad, oy + pad, s - pad * 2, (s - pad * 2) * .45, s * .22); ctx.fill();
  if (imgs[t].complete) ctx.drawImage(imgs[t], ox + s * .04, oy + s * .04, s * .92, s * .92);
  ctx.globalAlpha = 1;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function draw() {
  const ctx = bctx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, board.width, board.height);
  // grid
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
  for (let x = 1; x < W; x++) { ctx.beginPath(); ctx.moveTo(x * CS, 0); ctx.lineTo(x * CS, CS * (H - 1)); ctx.stroke(); }
  for (let y = 1; y < H - 1; y++) { ctx.beginPath(); ctx.moveTo(0, y * CS); ctx.lineTo(W * CS, y * CS); ctx.stroke(); }
  // danger mark at spawn column
  ctx.strokeStyle = 'rgba(224,71,63,.55)'; ctx.lineWidth = 2;
  const cx = 2 * CS + CS / 2, cy = CS / 2, r = CS * .22;
  ctx.beginPath(); ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r); ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r); ctx.stroke();
  if (!S) return;
  const pop = new Set(S.popping.map(([x, y]) => x + ',' + y));
  for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) {
    const c = S.grid[y][x]; if (!c) continue;
    const vy = (y - 1 - c.dy) * CS;
    if (pop.has(x + ',' + y)) {
      const k = S.popT / .45, blink = Math.floor(S.popT * 16) % 2;
      drawPiece(ctx, c.t, x * CS, vy, CS, 1 + k * .35, blink ? .35 : 1 - k * .6);
    } else drawPiece(ctx, c.t, x * CS, vy, CS);
  }
  if (S.cur && (S.phase === 'play' || S.phase === 'pause')) {
    const c = S.cur, [dx, dy] = DIRS[c.r];
    // ghost
    let gy = c.y; while (fits(c.x, gy + 1, c.r)) gy++;
    ctx.globalAlpha = .22;
    ctx.fillStyle = TYPES[c.a].tile; roundRect(ctx, c.x * CS + 3, (gy - 1) * CS + 3, CS - 6, CS - 6, 6); ctx.fill();
    ctx.fillStyle = TYPES[c.b].tile; roundRect(ctx, (c.x + dx) * CS + 3, (gy + dy - 1) * CS + 3, CS - 6, CS - 6, 6); ctx.fill();
    ctx.globalAlpha = 1;
    const pulse = 1 + Math.sin(performance.now() / 160) * .03;
    drawPiece(ctx, c.a, c.x * CS, (c.y - 1) * CS, CS, pulse);
    drawPiece(ctx, c.b, (c.x + dx) * CS, (c.y + dy - 1) * CS, CS);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of S.popups) {
    ctx.globalAlpha = Math.min(1, p.t * 2);
    ctx.font = `${CS * .5}px DotGothic16, monospace`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#111'; ctx.fillStyle = '#fff';
    const yy = (p.y - 1) * CS - (1.1 - p.t) * CS;
    ctx.strokeText(p.text, Math.min(Math.max(p.x * CS, CS), (W - 1) * CS), yy);
    ctx.fillText(p.text, Math.min(Math.max(p.x * CS, CS), (W - 1) * CS), yy);
  }
  if (S.banner) {
    ctx.globalAlpha = Math.min(1, S.banner.t * 3);
    ctx.font = `${CS * .82}px DotGothic16, monospace`;
    ctx.lineWidth = 6; ctx.strokeStyle = '#111'; ctx.fillStyle = '#ff8a3d';
    ctx.strokeText(S.banner.text, W * CS / 2, CS * 4.5); ctx.fillText(S.banner.text, W * CS / 2, CS * 4.5);
  }
  ctx.globalAlpha = 1;
  // next queue
  nctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const nw = nextC.clientWidth, ns = nw * .36;
  nctx.clearRect(0, 0, nw, nw * 1.25);
  S.queue.forEach(([a, b], i) => {
    const s = i === 0 ? ns : ns * .7, x = i === 0 ? nw * .1 : nw * .58, y = i === 0 ? nw * .15 : nw * .3;
    drawPiece(nctx, b, x, y, s); drawPiece(nctx, a, x, y + s, s);
  });
}

// ---------- input ----------
const held = { left: false, right: false, down: false, leftT: 0, rightT: 0, downT: 0 };
function press(k) {
  if (!S || S.phase === 'title' || S.phase === 'over') return;
  if (k === 'pause') return togglePause();
  if (S.phase === 'pause') return;
  if (k === 'left') { move(-1); held.left = true; held.leftT = .18; }
  if (k === 'right') { move(1); held.right = true; held.rightT = .18; }
  if (k === 'cw') rotate(1);
  if (k === 'ccw') rotate(-1);
  if (k === 'down') { softDrop(); held.down = true; held.downT = .1; }
  if (k === 'drop') hardDrop();
}
function release(k) { if (k in held) held[k] = false; }
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'cw', x: 'cw', X: 'cw', z: 'ccw', Z: 'ccw', ArrowDown: 'down', ' ': 'drop', p: 'pause', P: 'pause' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if ((e.key === 'Enter' || e.key === ' ') && !$('overlay').hidden) { e.preventDefault(); $('startBtn').click(); return; }
  if (!k) return;
  e.preventDefault(); if (!e.repeat) press(k);
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) release(k); });
const BTN = { kA: 'left', kB: 'cw', kC: 'right', kL: 'ccw', kD: 'down', kH: 'drop' };
for (const [id, k] of Object.entries(BTN)) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); el.classList.add('on'); press(k); });
  const up = () => { el.classList.remove('on'); release(k); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('click', e => { if (e.detail === 0) press(k); }); // keyboard activation
}
// touch gestures on the board
let tp = null;
board.addEventListener('pointerdown', e => { tp = { x: e.clientX, y: e.clientY, sx: e.clientX, t: performance.now(), moved: false }; board.setPointerCapture?.(e.pointerId); });
board.addEventListener('pointermove', e => {
  if (!tp || !S || S.phase !== 'play') return;
  const step = CS * .8;
  while (e.clientX - tp.x > step) { move(1); tp.x += step; tp.moved = true; }
  while (tp.x - e.clientX > step) { move(-1); tp.x -= step; tp.moved = true; }
});
board.addEventListener('pointerup', e => {
  if (!tp) return;
  const dy = e.clientY - tp.y, dt = performance.now() - tp.t;
  if (dy > CS * 2 && dt < 400 && Math.abs(e.clientX - tp.sx) < CS) hardDrop();
  else if (!tp.moved && Math.abs(dy) < 10) press('cw');
  tp = null;
});

$('startBtn').addEventListener('click', () => {
  if (S && S.phase === 'pause') togglePause(); else start();
});

// tiny chain chime (starts only after a user gesture)
let ac = null;
function beep(n) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 440 * Math.pow(2, Math.min(n - 1, 12) / 6);
    g.gain.setValueAtTime(.06, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .25);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .26);
  } catch (e) {}
}

function boot() {
  S = fresh();
  // demo board on the title screen so the first frame shows the game
  const demo = ['......', '......', '......', '......', '......', '......', '......', '......', '.5....', '56.3..', '5713.4', '217344'];
  demo.forEach((row, i) => [...row].forEach((ch, x) => { if (ch !== '.') S.grid[i + 1][x] = cell(+ch); }));
  resize(); requestAnimationFrame(frame);
}
addEventListener('resize', resize);
Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => {}) : null)).then(() => {});
boot();
</script>
