<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1162" viewBox="0 0 960 1162" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','IPAGothic',sans-serif">
<rect width="960" height="1162" fill="#ffffff"/>
<rect x="0" y="0" width="960" height="96" fill="#1e3a8a"/>
<text x="40" y="36" font-size="15" fill="#c7d2fe">LLM Internals 計算例題集 ・ 第3章 √dₖ によるスケーリング</text>
<text x="40" y="74" font-size="28" font-weight="700" fill="#ffffff">例題 03-1　内積の分散が d_k になることを確かめる</text>
<rect x="40" y="120" width="880" height="142" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><rect x="40" y="120" width="6" height="142" rx="3" fill="#0f766e"/><text x="64" y="152" font-size="20" font-weight="700" fill="#0f766e">これは何？ 何に使う？</text>
<text x="64" y="187" font-size="17" font-weight="700" fill="#b91c1c">何か</text>
<text x="164" y="187" font-size="17" fill="#1f2937" xml:space="preserve">Attention のスコアを √d_k で割る「スケーリング」の理論的な根拠。</text>
<text x="64" y="215" font-size="17" font-weight="700" fill="#b91c1c">何のため</text>
<text x="164" y="215" font-size="17" fill="#1f2937" xml:space="preserve">ベクトルの次元 d_k を大きくしても、スコアの散らばりが一定になるように</text>
<text x="164" y="243" font-size="17" fill="#1f2937" xml:space="preserve">するため。モデルを大きくしても同じ設定で安定して学習できる。</text>
<rect x="40" y="280" width="880" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><rect x="40" y="280" width="6" height="170" rx="3" fill="#2563eb"/><text x="64" y="312" font-size="20" font-weight="700" fill="#2563eb">問題</text>
<text x="64" y="347" font-size="17" fill="#1f2937" xml:space="preserve">q と k は d_k 次元のベクトルで、各成分は互いに独立、平均 0・分散 1 とする。</text>
<text x="64" y="375" font-size="17" fill="#1f2937" xml:space="preserve">(1) 内積 q·k = Σ q_i k_i の平均と分散を d_k で表せ。</text>
<text x="64" y="403" font-size="17" fill="#1f2937" xml:space="preserve">(2) d_k = 64 と d_k = 512 のとき、q·k の標準偏差はいくつか。</text>
<text x="64" y="431" font-size="17" fill="#1f2937" xml:space="preserve">(3) q·k / √d_k の標準偏差はいくつになるか。</text>
<rect x="40" y="468" width="880" height="420" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><rect x="40" y="468" width="6" height="420" rx="3" fill="#d97706"/><text x="64" y="500" font-size="20" font-weight="700" fill="#d97706">解説</text>
<text x="64" y="539" font-size="17" font-weight="700" fill="#d97706">(1) 1 項 q_i k_i の平均と分散</text>
<text x="64" y="567" font-size="17" fill="#1f2937" xml:space="preserve">q_i と k_i は独立なので、期待値は積に分けられる。</text>
<rect x="64" y="578" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="597" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">E[q_i k_i] = E[q_i]·E[k_i] = 0·0 = 0</text>
<rect x="64" y="608" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="627" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">Var(q_i k_i) = E[q_i² k_i²] − 0² = E[q_i²]·E[k_i²] = 1·1 = 1</text>
<text x="64" y="655" font-size="17" fill="#1f2937" xml:space="preserve">（平均 0 なので E[q_i²] = Var(q_i) = 1）</text>
<text x="64" y="687" font-size="17" font-weight="700" fill="#d97706">独立な d_k 個の和 → 平均も分散も足し算</text>
<rect x="64" y="698" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="717" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">E[q·k] = 0　　Var(q·k) = 1 + 1 + … + 1 = d_k</text>
<text x="64" y="749" font-size="17" font-weight="700" fill="#d97706">(2) 標準偏差 = √分散</text>
<rect x="64" y="760" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="779" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">d_k = 64 : √64 = 8　　d_k = 512 : √512 ≈ 22.6</text>
<text x="64" y="807" font-size="17" fill="#1f2937" xml:space="preserve">スコアが ±20 以上に散らばると、softmax がほぼ one-hot になってしまう（03-2）。</text>
<text x="64" y="839" font-size="17" font-weight="700" fill="#d97706">(3) 定数 c で割ると分散は 1/c² 倍</text>
<rect x="64" y="850" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="869" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">Var(q·k / √d_k) = d_k / (√d_k)² = d_k / d_k = 1</text>
<rect x="40" y="906" width="880" height="142" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><rect x="40" y="906" width="6" height="142" rx="3" fill="#059669"/><text x="64" y="938" font-size="20" font-weight="700" fill="#059669">解答</text>
<text x="64" y="973" font-size="17" fill="#1f2937" xml:space="preserve">(1) <tspan font-weight="700" fill="#b91c1c">平均 0、分散 d_k</tspan></text>
<text x="64" y="1001" font-size="17" fill="#1f2937" xml:space="preserve">(2) d_k = 64 → <tspan font-weight="700" fill="#b91c1c">8</tspan>、d_k = 512 → <tspan font-weight="700" fill="#b91c1c">約 22.6</tspan></text>
<text x="64" y="1029" font-size="17" fill="#1f2937" xml:space="preserve">(3) d_k によらず <tspan font-weight="700" fill="#b91c1c">1</tspan></text>
<rect x="40" y="1066" width="880" height="48" rx="10" fill="#f5f3ff"/>
<text x="60" y="1097" font-size="17" fill="#7c3aed" xml:space="preserve">★ √d_k で割るのは「次元を増やしてもスコアの散らばりを一定に保つ」ため。</text>
<text x="920" y="1148" font-size="12" text-anchor="end" fill="#6b7280">参考: github.com/amitshekhariitbhu/llm-internals</text>
</svg>
