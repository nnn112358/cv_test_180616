<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1002" viewBox="0 0 960 1002" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','IPAGothic',sans-serif">
<rect width="960" height="1002" fill="#ffffff"/>
<rect x="0" y="0" width="960" height="96" fill="#1e3a8a"/>
<text x="40" y="36" font-size="15" fill="#c7d2fe">LLM Internals 計算例題集 ・ 第3章 √dₖ によるスケーリング</text>
<text x="40" y="74" font-size="28" font-weight="700" fill="#ffffff">例題 03-1　内積の分散が d_k になることを確かめる</text>
<rect x="40" y="120" width="880" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><rect x="40" y="120" width="6" height="170" rx="3" fill="#2563eb"/><text x="64" y="152" font-size="20" font-weight="700" fill="#2563eb">問題</text>
<text x="64" y="187" font-size="17" fill="#1f2937" xml:space="preserve">q と k は d_k 次元のベクトルで、各成分は互いに独立、平均 0・分散 1 とする。</text>
<text x="64" y="215" font-size="17" fill="#1f2937" xml:space="preserve">(1) 内積 q·k = Σ q_i k_i の平均と分散を d_k で表せ。</text>
<text x="64" y="243" font-size="17" fill="#1f2937" xml:space="preserve">(2) d_k = 64 と d_k = 512 のとき、q·k の標準偏差はいくつか。</text>
<text x="64" y="271" font-size="17" fill="#1f2937" xml:space="preserve">(3) q·k / √d_k の標準偏差はいくつになるか。</text>
<rect x="40" y="308" width="880" height="420" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><rect x="40" y="308" width="6" height="420" rx="3" fill="#d97706"/><text x="64" y="340" font-size="20" font-weight="700" fill="#d97706">解説</text>
<text x="64" y="379" font-size="17" font-weight="700" fill="#d97706">(1) 1 項 q_i k_i の平均と分散</text>
<text x="64" y="407" font-size="17" fill="#1f2937" xml:space="preserve">q_i と k_i は独立なので、期待値は積に分けられる。</text>
<rect x="64" y="418" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="437" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">E[q_i k_i] = E[q_i]·E[k_i] = 0·0 = 0</text>
<rect x="64" y="448" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="467" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">Var(q_i k_i) = E[q_i² k_i²] − 0² = E[q_i²]·E[k_i²] = 1·1 = 1</text>
<text x="64" y="495" font-size="17" fill="#1f2937" xml:space="preserve">（平均 0 なので E[q_i²] = Var(q_i) = 1）</text>
<text x="64" y="527" font-size="17" font-weight="700" fill="#d97706">独立な d_k 個の和 → 平均も分散も足し算</text>
<rect x="64" y="538" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="557" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">E[q·k] = 0　　Var(q·k) = 1 + 1 + … + 1 = d_k</text>
<text x="64" y="589" font-size="17" font-weight="700" fill="#d97706">(2) 標準偏差 = √分散</text>
<rect x="64" y="600" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="619" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">d_k = 64 : √64 = 8　　d_k = 512 : √512 ≈ 22.6</text>
<text x="64" y="647" font-size="17" fill="#1f2937" xml:space="preserve">スコアが ±20 以上に散らばると、softmax がほぼ one-hot になってしまう（03-2）。</text>
<text x="64" y="679" font-size="17" font-weight="700" fill="#d97706">(3) 定数 c で割ると分散は 1/c² 倍</text>
<rect x="64" y="690" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="709" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">Var(q·k / √d_k) = d_k / (√d_k)² = d_k / d_k = 1</text>
<rect x="40" y="746" width="880" height="142" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><rect x="40" y="746" width="6" height="142" rx="3" fill="#059669"/><text x="64" y="778" font-size="20" font-weight="700" fill="#059669">解答</text>
<text x="64" y="813" font-size="17" fill="#1f2937" xml:space="preserve">(1) <tspan font-weight="700" fill="#b91c1c">平均 0、分散 d_k</tspan></text>
<text x="64" y="841" font-size="17" fill="#1f2937" xml:space="preserve">(2) d_k = 64 → <tspan font-weight="700" fill="#b91c1c">8</tspan>、d_k = 512 → <tspan font-weight="700" fill="#b91c1c">約 22.6</tspan></text>
<text x="64" y="869" font-size="17" fill="#1f2937" xml:space="preserve">(3) d_k によらず <tspan font-weight="700" fill="#b91c1c">1</tspan></text>
<rect x="40" y="906" width="880" height="48" rx="10" fill="#f5f3ff"/>
<text x="60" y="937" font-size="17" fill="#7c3aed" xml:space="preserve">★ √d_k で割るのは「次元を増やしてもスコアの散らばりを一定に保つ」ため。</text>
<text x="920" y="988" font-size="12" text-anchor="end" fill="#6b7280">参考: github.com/amitshekhariitbhu/llm-internals</text>
</svg>
