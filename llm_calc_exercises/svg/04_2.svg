<svg xmlns="http://www.w3.org/2000/svg" width="960" height="916" viewBox="0 0 960 916" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','IPAGothic',sans-serif">
<rect width="960" height="916" fill="#ffffff"/>
<rect x="0" y="0" width="960" height="96" fill="#1e3a8a"/>
<text x="40" y="36" font-size="15" fill="#c7d2fe">LLM Internals 計算例題集 ・ 第4章 Causal Mask</text>
<text x="40" y="74" font-size="28" font-weight="700" fill="#ffffff">例題 04-2　マスク行列の有効要素数を数える</text>
<rect x="40" y="120" width="880" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><rect x="40" y="120" width="6" height="170" rx="3" fill="#2563eb"/><text x="64" y="152" font-size="20" font-weight="700" fill="#2563eb">問題</text>
<text x="64" y="187" font-size="17" fill="#1f2937" xml:space="preserve">系列長 n の Causal Mask を考える。</text>
<text x="64" y="215" font-size="17" fill="#1f2937" xml:space="preserve">(1) n = 6 のとき、注目できる（マスクされない）要素数と、マスクされる要素数を求めよ。</text>
<text x="64" y="243" font-size="17" fill="#1f2937" xml:space="preserve">(2) 一般の n について、有効要素数を n の式で表せ。</text>
<text x="64" y="271" font-size="17" fill="#1f2937" xml:space="preserve">(3) n = 4096 のとき、有効要素は全体の何 % か。</text>
<rect x="40" y="308" width="880" height="362" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><rect x="40" y="308" width="6" height="362" rx="3" fill="#d97706"/><text x="64" y="340" font-size="20" font-weight="700" fill="#d97706">解説</text>
<text x="64" y="379" font-size="17" font-weight="700" fill="#d97706">(1) 行ごとに数える</text>
<text x="64" y="407" font-size="17" fill="#1f2937" xml:space="preserve">トークン i（1 始まり）は自分を含めて i 個のトークンを見られる。</text>
<rect x="64" y="418" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="437" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">1 + 2 + 3 + 4 + 5 + 6 = 21</text>
<rect x="64" y="448" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="467" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">全体 6 × 6 = 36 → マスクされる要素 = 36 − 21 = 15</text>
<text x="64" y="499" font-size="17" font-weight="700" fill="#d97706">(2) 1 から n までの和</text>
<rect x="64" y="510" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="529" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">1 + 2 + … + n = n(n+1)/2   （対角を含む下三角）</text>
<text x="64" y="561" font-size="17" font-weight="700" fill="#d97706">(3) 割合</text>
<rect x="64" y="572" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="591" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">n(n+1)/2 ÷ n² = (n+1)/(2n)</text>
<rect x="64" y="602" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="621" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">n = 4096: 4097 / 8192 = 0.50012… → 約 50.01 %</text>
<rect x="64" y="632" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="651" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">（要素数: 8,390,656 / 16,777,216）</text>
<rect x="40" y="688" width="880" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><rect x="40" y="688" width="6" height="86" rx="3" fill="#059669"/><text x="64" y="720" font-size="20" font-weight="700" fill="#059669">解答</text>
<text x="64" y="755" font-size="17" fill="#1f2937" xml:space="preserve">(1) 有効 <tspan font-weight="700" fill="#b91c1c">21</tspan>、マスク <tspan font-weight="700" fill="#b91c1c">15</tspan>　(2) <tspan font-weight="700" fill="#b91c1c">n(n+1)/2</tspan>　(3) <tspan font-weight="700" fill="#b91c1c">約 50.01 %</tspan></text>
<rect x="40" y="792" width="880" height="76" rx="10" fill="#f5f3ff"/>
<text x="60" y="823" font-size="17" fill="#7c3aed" xml:space="preserve">★ 長い系列ではスコア行列のほぼ半分が無駄。Flash Attention などは</text>
<text x="60" y="851" font-size="17" fill="#7c3aed" xml:space="preserve">　 全部が −∞ のブロックを丸ごと飛ばして計算を約半分にする。</text>
<text x="920" y="902" font-size="12" text-anchor="end" fill="#6b7280">参考: github.com/amitshekhariitbhu/llm-internals</text>
</svg>
