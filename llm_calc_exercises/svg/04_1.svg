<rect x="220.88" y="420" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="248.88" y="440" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2</text>
<text x="64" y="481" font-size="17" fill="#1f2937" xml:space="preserve">行 i はトークン i（クエリ）、列 j はトークン j（キー）を表す。</text>
<text x="64" y="509" font-size="17" fill="#1f2937" xml:space="preserve">(1) Causal Mask を加えたスコア行列を書け。</text>
<text x="64" y="537" font-size="17" fill="#1f2937" xml:space="preserve">(2) 各行に softmax を適用して重み行列 A を求めよ（小数第 3 位まで）。</text>
<rect x="40" y="574" width="880" height="374" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><rect x="40" y="574" width="6" height="374" rx="3" fill="#d97706"/><text x="64" y="606" font-size="20" font-weight="700" fill="#d97706">解説</text>
<text x="64" y="645" font-size="17" font-weight="700" fill="#d97706">(1) 未来（j &gt; i）のスコアを −∞ にする</text>
<text x="64" y="673" font-size="17" fill="#1f2937" xml:space="preserve">生成時、トークン i はまだ出ていない i+1 以降を見てはいけない。</text>
<text x="64" y="701" font-size="17" fill="#1f2937" xml:space="preserve">そこで上三角（対角より右上）に −∞ を足す。e^{−∞} = 0 なので重みが 0 になる。</text>
<text x="72" y="765.0" font-size="16" fill="#1f2937">M =</text>
<rect x="108.88" y="714" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="136.88" y="734" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0</text>
<rect x="164.88" y="714" width="56" height="30" fill="#fee2e2" stroke="#94a3b8"/>
<text x="192.88" y="734" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">-∞</text>
<rect x="220.88" y="714" width="56" height="30" fill="#fee2e2" stroke="#94a3b8"/>
<text x="248.88" y="734" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">-∞</text>
<rect x="108.88" y="744" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="136.88" y="764" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0</text>
<rect x="164.88" y="744" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="192.88" y="764" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0</text>
<rect x="220.88" y="744" width="56" height="30" fill="#fee2e2" stroke="#94a3b8"/>
<text x="248.88" y="764" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">-∞</text>
<rect x="108.88" y="774" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="136.88" y="794" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0</text>
<rect x="164.88" y="774" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="192.88" y="794" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0</text>
<rect x="220.88" y="774" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="248.88" y="794" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0</text>
<text x="312.88" y="765.0" font-size="16" fill="#1f2937">S + M =</text>
<rect x="385.6" y="714" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="413.6" y="734" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2</text>
<rect x="441.6" y="714" width="56" height="30" fill="#fee2e2" stroke="#94a3b8"/>
<text x="469.6" y="734" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">-∞</text>
<rect x="497.6" y="714" width="56" height="30" fill="#fee2e2" stroke="#94a3b8"/>
<text x="525.6" y="734" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">-∞</text>
<rect x="385.6" y="744" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="413.6" y="764" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">1</text>
<rect x="441.6" y="744" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="469.6" y="764" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">3</text>
<rect x="497.6" y="744" width="56" height="30" fill="#fee2e2" stroke="#94a3b8"/>
<text x="525.6" y="764" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">-∞</text>
<rect x="385.6" y="774" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
