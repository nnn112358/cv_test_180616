<text x="64" y="1139" font-size="17" fill="#1f2937" xml:space="preserve">A は<tspan font-weight="700" fill="#b91c1c">下三角行列</tspan>になり、各行の和は 1。</text>
<rect x="40" y="1176" width="880" height="76" rx="10" fill="#f5f3ff"/>
<text x="60" y="1207" font-size="17" fill="#7c3aed" xml:space="preserve">★ 1 行目の「私」は自分自身しか見られないので、重みは必ず 1 になる。</text>
<text x="60" y="1235" font-size="17" fill="#7c3aed" xml:space="preserve">　 マスクを softmax の「前」に入れるのがポイント（後で 0 にすると行の和が 1 でなくなる）。</text>
