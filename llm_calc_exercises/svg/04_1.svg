<rect x="220.88" y="390" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="248.88" y="410" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">1</text>
