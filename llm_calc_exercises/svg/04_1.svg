<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1300" viewBox="0 0 960 1300" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','IPAGothic',sans-serif">
<rect width="960" height="1300" fill="#ffffff"/>
<rect x="0" y="0" width="960" height="96" fill="#1e3a8a"/>
<text x="40" y="36" font-size="15" fill="#c7d2fe">LLM Internals 計算例題集 ・ 第4章 Causal Mask</text>
<text x="40" y="74" font-size="28" font-weight="700" fill="#ffffff">例題 04-1　マスク後の softmax を計算する</text>
<rect x="40" y="120" width="880" height="142" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><rect x="40" y="120" width="6" height="142" rx="3" fill="#0f766e"/><text x="64" y="152" font-size="20" font-weight="700" fill="#0f766e">これは何？ 何に使う？</text>
<text x="64" y="187" font-size="17" font-weight="700" fill="#b91c1c">何か</text>
<text x="164" y="187" font-size="17" fill="#1f2937" xml:space="preserve">Attention で「自分より後ろ（未来）のトークン」を見えなくするマスク。</text>
<text x="64" y="215" font-size="17" font-weight="700" fill="#b91c1c">何のため</text>
<text x="164" y="215" font-size="17" fill="#1f2937" xml:space="preserve">次のトークンを予測するときに答えを先に見る「カンニング」を防ぎ、</text>
<text x="164" y="243" font-size="17" fill="#1f2937" xml:space="preserve">学習時と文章生成時の条件を揃えるため。GPT 型のデコーダでは必須。</text>
<rect x="40" y="280" width="880" height="276" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><rect x="40" y="280" width="6" height="276" rx="3" fill="#2563eb"/><text x="64" y="312" font-size="20" font-weight="700" fill="#2563eb">問題</text>
<text x="64" y="347" font-size="17" fill="#1f2937" xml:space="preserve">デコーダの 3 トークン「私 は 猫」について、スケーリング後のスコア S が次のように出た。</text>
<text x="72" y="411.0" font-size="16" fill="#1f2937">S =</text>
<rect x="108.88" y="360" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="136.88" y="380" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2</text>
<rect x="164.88" y="360" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="192.88" y="380" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">1</text>
<rect x="220.88" y="360" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="248.88" y="380" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0</text>
<rect x="108.88" y="390" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
