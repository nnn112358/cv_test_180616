<rect x="497.6" y="774" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="525.6" y="794" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2</text>
<text x="64" y="839" font-size="17" font-weight="700" fill="#d97706">(2) −∞ を除いた要素だけで softmax</text>
<rect x="64" y="850" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="869" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">1行目: e² だけ → (1, 0, 0)</text>
<rect x="64" y="880" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="899" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">2行目: e¹=2.718, e³=20.086 合計 22.804 → (0.119, 0.881, 0)</text>
<rect x="64" y="910" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="929" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">3行目: e⁰=1, e²=7.389, e²=7.389 合計 15.778 → (0.063, 0.468, 0.468)</text>
<rect x="40" y="966" width="880" height="192" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><rect x="40" y="966" width="6" height="192" rx="3" fill="#059669"/><text x="64" y="998" font-size="20" font-weight="700" fill="#059669">解答</text>
<text x="72" y="1069.0" font-size="16" fill="#1f2937">A ≈</text>
<rect x="108.88" y="1018" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="140.38" y="1038" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">1.000</text>
