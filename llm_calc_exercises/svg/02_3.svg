<text x="519.02" y="956" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2.314</text>
<text x="64" y="997" font-size="17" fill="#1f2937" xml:space="preserve">まとめると <tspan font-weight="700" fill="#b91c1c">Attention(Q,K,V) = softmax(Q·Kᵀ / √d_k)·V</tspan>。</text>
<rect x="40" y="1034" width="880" height="48" rx="10" fill="#f5f3ff"/>
<text x="60" y="1065" font-size="17" fill="#7c3aed" xml:space="preserve">★ 出力の各行は「全トークンの V の加重平均」。どのトークンをどれだけ混ぜるかを A が決める。</text>
