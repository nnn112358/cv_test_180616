<text x="519.02" y="896" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2.292</text>
<rect x="424.52" y="906" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="456.02" y="926" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.599</text>
<rect x="487.52" y="906" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="519.02" y="926" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2.000</text>
