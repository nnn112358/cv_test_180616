<text x="203.38" y="1084" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.284</text>
<rect x="234.88" y="1064" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="266.38" y="1084" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.576</text>
<rect x="108.88" y="1094" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="140.38" y="1114" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.198</text>
<rect x="171.88" y="1094" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="203.38" y="1114" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.401</text>
<rect x="234.88" y="1094" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="266.38" y="1114" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.401</text>
<rect x="108.88" y="1124" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="140.38" y="1144" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.074</text>
<rect x="171.88" y="1124" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="203.38" y="1144" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.306</text>
<rect x="234.88" y="1124" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="266.38" y="1144" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.620</text>
<text x="333.88" y="1115.0" font-size="16" fill="#1f2937">Z = A·V ≈</text>
<rect x="424.52" y="1064" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="456.02" y="1084" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.716</text>
<rect x="487.52" y="1064" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="519.02" y="1084" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2.292</text>
<rect x="424.52" y="1094" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="456.02" y="1114" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.599</text>
<rect x="487.52" y="1094" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="519.02" y="1114" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2.000</text>
<rect x="424.52" y="1124" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="456.02" y="1144" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.694</text>
<rect x="487.52" y="1124" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="519.02" y="1144" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">2.314</text>
<text x="64" y="1185" font-size="17" fill="#1f2937" xml:space="preserve">まとめると <tspan font-weight="700" fill="#b91c1c">Attention(Q,K,V) = softmax(Q·Kᵀ / √d_k)·V</tspan>。</text>
<rect x="40" y="1222" width="880" height="48" rx="10" fill="#f5f3ff"/>
<text x="60" y="1253" font-size="17" fill="#7c3aed" xml:space="preserve">★ 出力の各行は「全トークンの V の加重平均」。どのトークンをどれだけ混ぜるかを A が決める。</text>
