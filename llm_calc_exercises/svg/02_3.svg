<text x="64" y="187" font-size="17" fill="#1f2937" xml:space="preserve">例題 02-2 のスケーリング後のスコアと、02-1 の V を使う。</text>
<text x="72" y="251.0" font-size="16" fill="#1f2937">S/√2 =</text>
<rect x="135.76" y="200" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="167.26" y="220" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.707</text>
