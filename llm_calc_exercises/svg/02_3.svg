<text x="425.64" y="280" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">1</text>
<rect x="453.64" y="260" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="481.64" y="280" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">3</text>
<text x="64" y="321" font-size="17" fill="#1f2937" xml:space="preserve">(1) 各行に softmax を適用して重み行列 A を求めよ（小数第 3 位まで）。</text>
<text x="64" y="349" font-size="17" fill="#1f2937" xml:space="preserve">(2) 出力 Z = A·V を求めよ。</text>
<rect x="40" y="386" width="880" height="420" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><rect x="40" y="386" width="6" height="420" rx="3" fill="#d97706"/><text x="64" y="418" font-size="20" font-weight="700" fill="#d97706">解説</text>
<text x="64" y="457" font-size="17" font-weight="700" fill="#d97706">(1) softmax(z)_j = e^{z_j} / Σ_k e^{z_k}（行ごとに計算）</text>
<rect x="64" y="468" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="487" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">1行目: e^0.707=2.028  e^1.414=4.113  e^2.121=8.342  合計 14.483</text>
<rect x="64" y="498" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="517" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">        → 2.028/14.483=0.140  4.113/14.483=0.284  8.342/14.483=0.576</text>
<rect x="64" y="528" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="547" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">2行目: e^0=1  e^0.707=2.028  e^0.707=2.028  合計 5.056</text>
<rect x="64" y="558" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="577" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">        → 0.198  0.401  0.401</text>
<rect x="64" y="588" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="607" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">3行目: 2.028  8.342  16.918  合計 27.288 → 0.074  0.306  0.620</text>
<text x="64" y="635" font-size="17" fill="#1f2937" xml:space="preserve">各行の和は 1 になる（確率分布）。</text>
<text x="64" y="667" font-size="17" font-weight="700" fill="#d97706">(2) 出力は V の行を重み付きで足したもの</text>
<rect x="64" y="678" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="697" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">z1 = 0.140·(1,2) + 0.284·(0,1) + 0.576·(1,3)</text>
<rect x="64" y="708" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="727" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">   = (0.140+0+0.576, 0.280+0.284+1.728) = (0.716, 2.292)</text>
<rect x="64" y="738" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="757" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">z2 = 0.198·(1,2) + 0.401·(0,1) + 0.401·(1,3) = (0.599, 2.000)</text>
<rect x="64" y="768" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="787" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">z3 = 0.074·(1,2) + 0.306·(0,1) + 0.620·(1,3) = (0.694, 2.314)</text>
<rect x="40" y="824" width="880" height="192" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><rect x="40" y="824" width="6" height="192" rx="3" fill="#059669"/><text x="64" y="856" font-size="20" font-weight="700" fill="#059669">解答</text>
