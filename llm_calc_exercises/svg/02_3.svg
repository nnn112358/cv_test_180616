<text x="266.38" y="896" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.576</text>
<rect x="108.88" y="906" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="140.38" y="926" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.198</text>
<rect x="171.88" y="906" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="203.38" y="926" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.401</text>
<rect x="234.88" y="906" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="266.38" y="926" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.401</text>
<rect x="108.88" y="936" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="140.38" y="956" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.074</text>
<rect x="171.88" y="936" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="203.38" y="956" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.306</text>
<rect x="234.88" y="936" width="63.0" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="266.38" y="956" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0.620</text>
<text x="333.88" y="927.0" font-size="16" fill="#1f2937">Z = A·V ≈</text>
