<text x="256.88" y="424.0" font-size="16" fill="#1f2937">W_Q =</text>
<rect x="311.68" y="388" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="339.68" y="408" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">1</text>
