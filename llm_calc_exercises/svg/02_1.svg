<text x="40" y="36" font-size="15" fill="#c7d2fe">LLM Internals 計算例題集 ・ 第2章 Attention の Q・K・V</text>
<text x="40" y="74" font-size="28" font-weight="700" fill="#ffffff">例題 02-1　X·W で Q, K, V を求める</text>
<rect x="40" y="120" width="880" height="170" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><rect x="40" y="120" width="6" height="170" rx="3" fill="#0f766e"/><text x="64" y="152" font-size="20" font-weight="700" fill="#0f766e">これは何？ 何に使う？</text>
<text x="64" y="187" font-size="17" font-weight="700" fill="#b91c1c">何か</text>
<text x="164" y="187" font-size="17" fill="#1f2937" xml:space="preserve">Attention の最初の処理。各トークンのベクトルを、Query（何を探すか）・</text>
<text x="164" y="215" font-size="17" fill="#1f2937" xml:space="preserve">Key（自分は何か）・Value（渡す中身）の 3 つに線形変換する。</text>
<text x="64" y="243" font-size="17" font-weight="700" fill="#b91c1c">何のため</text>
<text x="164" y="243" font-size="17" fill="#1f2937" xml:space="preserve">「どのトークンを参照するか（Q と K）」と「参照したら何を受け取るか（V）」</text>
<text x="164" y="271" font-size="17" fill="#1f2937" xml:space="preserve">を別々に学習できるようにするため。</text>
<rect x="40" y="308" width="880" height="220" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><rect x="40" y="308" width="6" height="220" rx="3" fill="#2563eb"/><text x="64" y="340" font-size="20" font-weight="700" fill="#2563eb">問題</text>
<text x="64" y="375" font-size="17" fill="#1f2937" xml:space="preserve">3 トークンの入力 X（各行が 1 トークン、d = 2）と重み行列が次のように与えられている。</text>
<text x="72" y="439.0" font-size="16" fill="#1f2937">X =</text>
<rect x="108.88" y="388" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="136.88" y="408" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">1</text>
<rect x="164.88" y="388" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
<text x="192.88" y="408" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="15" fill="#1f2937">0</text>
<rect x="108.88" y="418" width="56" height="30" fill="#ffffff" stroke="#94a3b8"/>
