<text x="60" y="977" font-size="17" fill="#7c3aed" xml:space="preserve">★ Q は「何を探すか」、K は「何を持っているか」、V は「渡す中身」。</text>
<text x="60" y="1005" font-size="17" fill="#7c3aed" xml:space="preserve">　 同じ入力 X から、学習した 3 つの重みで別々の表現を作る。</text>
