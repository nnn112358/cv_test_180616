<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1258" viewBox="0 0 960 1258" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','IPAGothic',sans-serif">
<rect width="960" height="1258" fill="#ffffff"/>
