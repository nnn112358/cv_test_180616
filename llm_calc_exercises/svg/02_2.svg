<text x="64" y="615" font-size="17" fill="#1f2937" xml:space="preserve">(1) スコア行列 S = Q·Kᵀ を求めよ。</text>
<text x="64" y="643" font-size="17" fill="#1f2937" xml:space="preserve">(2) d_k = 2 として S / √d_k を小数第 3 位まで求めよ。</text>
<rect x="40" y="680" width="880" height="298" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><rect x="40" y="680" width="6" height="298" rx="3" fill="#d97706"/><text x="64" y="712" font-size="20" font-weight="700" fill="#d97706">解説</text>
<text x="64" y="751" font-size="17" font-weight="700" fill="#d97706">(1) S の (i, j) 成分 = トークン i の q とトークン j の k の内積</text>
<rect x="64" y="762" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="781" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">q1=(1,1): k1=(1,0)→1  k2=(1,1)→2  k3=(2,1)→3</text>
<rect x="64" y="792" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="811" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">q2=(0,1): k1→0        k2→1        k3→1</text>
<rect x="64" y="822" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="841" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">q3=(1,2): k1→1        k2→1+2=3    k3→2+2=4</text>
<text x="64" y="869" font-size="17" fill="#1f2937" xml:space="preserve">値が大きいほど「トークン i がトークン j に注目したい」度合いが強い。</text>
<text x="64" y="901" font-size="17" font-weight="700" fill="#d97706">(2) √2 ≈ 1.4142 で割る</text>
<rect x="64" y="912" width="836" height="26" rx="4" fill="#f3f4f6"/>
<text x="76" y="931" font-family="'DejaVu Sans Mono','Menlo','Consolas','Noto Sans Mono CJK JP','IPAGothic',monospace" font-size="16" fill="#1f2937" xml:space="preserve">1/√2 = 0.707　2/√2 = 1.414　3/√2 = 2.121　4/√2 = 2.828</text>
<text x="64" y="959" font-size="17" fill="#1f2937" xml:space="preserve">d_k が大きいと内積が大きくなりすぎるので、√d_k で割って大きさを揃える（第 3 章）。</text>
