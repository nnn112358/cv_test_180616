<text x="64" y="187" font-size="17" font-weight="700" fill="#b91c1c">何か</text>
<text x="164" y="187" font-size="17" fill="#1f2937" xml:space="preserve">各トークンの Query と全トークンの Key の内積を並べた「関連度の表」。</text>
<text x="64" y="215" font-size="17" font-weight="700" fill="#b91c1c">何のため</text>
<text x="164" y="215" font-size="17" fill="#1f2937" xml:space="preserve">文中のどの単語がどの単語と関係が深いか（例:「それ」が指す名詞）を</text>
<text x="164" y="243" font-size="17" fill="#1f2937" xml:space="preserve">数値で表すため。値が大きいほど強く参照する。</text>
