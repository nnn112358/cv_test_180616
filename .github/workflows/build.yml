name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ pkg-config libopencv-dev

      - name: Build
        run: g++ homograpy.cpp -o homography $(pkg-config --cflags --libs opencv4)

      - name: Run
        run: ./homography
